<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Everyday Mug</title>
  <link rel="stylesheet" href="soup.css">
</head>
<body>
  <main class="card">
    <img src="mug.jpg" alt="Cream-colored stoneware mug">

    <div class="details">
